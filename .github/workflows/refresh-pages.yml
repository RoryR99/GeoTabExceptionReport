name: Refresh GeoTab Reports

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Trip look-back window in days"
        required: false
        default: "7"
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: geotab-reports
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install geospatial system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run GeoTab ETL
        env:
          GEOTAB_DATABASE: ${{ secrets.GEOTAB_DATABASE }}
          GEOTAB_USERNAME: ${{ secrets.GEOTAB_USERNAME }}
          GEOTAB_PASSWORD: ${{ secrets.GEOTAB_PASSWORD }}
          GEOTAB_SERVER: ${{ secrets.GEOTAB_SERVER || 'my.geotab.com' }}
          DAYS_BACK: ${{ github.event.inputs.days || '30' }}
          GENERATE_HTML_REPORT: "true"
          GENERATE_FOLIUM_MAP: "true"
          ALERT_EMAIL_ENABLED: "false"
        run: python -m scripts.main --days "$DAYS_BACK"

      - name: Verify report files
        run: |
          test -f reports/etl_report.html
          test -f reports/trip_map.html
          touch reports/.nojekyll

      - name: Commit refreshed reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Refresh GeoTab reports"
            git push
          fi
